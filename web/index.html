<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A minimal CO₂ footprint estimator. No tracking. No data stored.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Co2 Footprint Easy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Co2 Footprint Easy</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0F0F0E;
      height: 100%;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background-color: #0F0F0E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      z-index: 9999;
      opacity: 1;
      transition: opacity 350ms ease-out;
    }

    #loading-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading-wordmark {
      color: #E8E6E1;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.08em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    #loading-indicator {
      display: flex;
      gap: 8px;
    }

    #loading-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #4A9B6F;
      animation: fp-pulse 1.2s ease-in-out infinite;
    }

    #loading-indicator span:nth-child(2) { animation-delay: 0.2s; }
    #loading-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fp-pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40%            { opacity: 1;    transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div id="loading-wordmark">Co2 Footprint Easy</div>
    <div id="loading-indicator">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
