<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #0F0F0E; display: flex; gap: 40px;
         align-items: center; justify-content: center; min-height: 100vh; flex-wrap: wrap; }
  img  { display: block; }
  p    { color: #7A7875; font-family: sans-serif; font-size: 12px;
         text-align: center; margin: 6px 0 0; }
  div  { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div><img src="logo.svg" width="512" height="512"><p>512 × 512</p></div>
  <div><img src="logo.svg" width="192" height="192"><p>192 × 192</p></div>
  <div><img src="logo.svg" width="96"  height="96" ><p>96 × 96</p></div>
  <div><img src="logo.svg" width="48"  height="48" ><p>48 × 48</p></div>
</body>
</html>
